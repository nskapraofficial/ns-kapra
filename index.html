<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0F3D2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>NS Kapra — Cloth Shop Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F3D2E'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='60' fill='%23D4A548' font-family='Arial'%3E👕%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --green-dark:#0F3D2E; --green-mid:#1B5E3F; --green-accent:#2E7D5B; --green-soft:#E8F3EC;
    --gold:#D4A548; --white:#FFFFFF; --cream:#FAFBF9; --ink:#0B1F17;
    --muted:#6B7A72; --border:#E5EDE7; --danger:#B4231F; --danger-soft:#FDECEB; --blue:#2A6BC2; --blue-soft:#E7F0FB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  input,select,textarea,button{font-family:inherit;font-size:16px}
  button{cursor:pointer;border:none;background:none}
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px;background:var(--cream)}
  /* HEADER */
  .header{position:sticky;top:0;z-index:40;background:var(--green-dark);padding:16px 20px;padding-top:calc(env(safe-area-inset-top) + 16px);overflow:hidden}
  .header::before{content:"";position:absolute;inset:0;opacity:.3;background:radial-gradient(circle at 20% 0%,var(--green-accent) 0%,transparent 50%),radial-gradient(circle at 90% 100%,rgba(212,165,72,.33) 0%,transparent 45%)}
  .header-row{position:relative;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(212,165,72,.15);border:1px solid rgba(212,165,72,.33);font-size:20px}
  .brand h1{color:var(--white);font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}
  .brand p{color:var(--gold);font-size:11px;margin:0;margin-top:2px}
  .refresh-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:var(--white);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .refresh-btn:active{transform:scale(.92)}
  /* CONTENT */
  .content{padding:16px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .section-title{display:flex;align-items:center;gap:10px}
  .section-icon{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .section-title h2{font-size:16px;font-weight:800;margin:0;line-height:1.1}
  .section-title p{font-size:10px;color:var(--muted);margin:0;line-height:1.1;margin-top:2px}
  .btn-primary{background:var(--green-dark);color:var(--white);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;transition:transform .2s}
  .btn-primary:active{transform:scale(.95)}
  /* CARDS */
  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px}
  .card-list{display:flex;flex-direction:column;gap:8px}
  .empty{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px 20px;text-align:center}
  .empty-icon{width:56px;height:56px;border-radius:16px;background:var(--green-soft);color:var(--green-accent);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px}
  .empty h3{font-size:14px;margin:0}
  .empty p{font-size:11px;color:var(--muted);margin:2px 0 0}
  /* HERO */
  .hero{position:relative;overflow:hidden;background:var(--green-dark);border-radius:24px;padding:20px;margin-bottom:14px}
  .hero::before{content:"";position:absolute;right:-32px;bottom:-32px;width:160px;height:160px;border-radius:50%;background:rgba(212,165,72,.09)}
  .hero::after{content:"";position:absolute;left:-24px;top:-24px;width:128px;height:128px;border-radius:50%;background:rgba(46,125,91,.18)}
  .hero-content{position:relative}
  .hero-label{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
  .hero-value{color:var(--white);font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .hero-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;background:rgba(212,165,72,.18);border:1px solid rgba(212,165,72,.33);color:var(--gold);font-size:11px;font-weight:700;margin-top:10px}
  /* STAT GRID */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;animation:countUp .4s ease-out both}
  .stat-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:8px}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  .stat-sub{font-size:10px;color:var(--muted)}
  .stat-value{font-size:18px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
  /* QUICK ACTIONS */
  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .quick-btn{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
  .quick-btn:active{transform:scale(.95)}
  .quick-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .quick-label{font-size:10px;font-weight:700;color:var(--ink)}
  /* LIST ROW */
  .list-row{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px}
  .list-head{display:flex;align-items:center;gap:12px}
  .list-icon{width:44px;height:44px;border-radius:16px;background:var(--green-soft);color:var(--green-accent);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .list-body{flex:1;min-width:0}
  .list-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .list-actions{display:flex;gap:4px}
  .icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green-accent);transition:transform .2s;font-size:12px}
  .icon-btn.danger{background:var(--danger-soft);color:var(--danger)}
  .icon-btn:active{transform:scale(.9)}
  .list-bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
  .list-bottom div p:first-child{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0}
  .list-bottom div p:last-child{font-size:12px;font-weight:800;margin:2px 0 0}
  /* CHIPS */
  .chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .chip-meter{background:var(--blue-soft);color:var(--blue)}
  .chip-suit{background:var(--green-soft);color:var(--green-accent)}
  /* SEARCH & FILTER */
  .search-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .search-box{flex:1;position:relative}
  .search-box input{width:100%;padding:10px 12px 10px 34px;border-radius:99px;border:1px solid var(--border);background:var(--white);font-size:14px}
  .search-box input:focus{outline:none;border-color:#c8d5cc}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
  .filter-pills{display:flex;background:var(--green-soft);border-radius:99px;padding:4px;gap:2px}
  .filter-pills button{padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;color:var(--green-accent);transition:all .2s}
  .filter-pills button.active{background:var(--white);color:var(--green-dark);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chip-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .chip-scroll::-webkit-scrollbar{display:none}
  .chip-scroll button{padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;background:var(--white);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
  .chip-scroll button.active{background:var(--green-dark);color:var(--white);border-color:var(--green-dark)}
  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(11,31,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease-out}
  .modal{width:100%;max-width:480px;background:var(--white);border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideUpModal .28s ease-out;box-shadow:0 -8px 32px rgba(0,0,0,.15)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .modal-head h3{font-size:16px;font-weight:800;margin:0}
  .modal-close{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:14px}
  /* FORM */
  .field{margin-bottom:12px;display:block}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 14px;border-radius:16px;border:1px solid var(--border);background:var(--white);color:var(--ink);font-size:14px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-accent)}
  .field textarea{resize:none}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn-block{width:100%;padding:12px;border-radius:16px;color:var(--white);background:var(--green-dark);font-weight:700;font-size:14px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-top:4px}
  .btn-block:active{transform:scale(.97)}
  .btn-block:disabled{opacity:.5}
  .btn-block.wa{background:#25D366}
  .btn-block.secondary{background:var(--white);color:var(--green-dark);border:1px solid var(--border)}
  .btn-block.danger{background:var(--danger-soft);color:var(--danger);border:1px solid #F5C4C1}
  .type-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .type-picker button{padding:10px;border-radius:16px;font-size:13px;font-weight:700;background:var(--green-soft);color:var(--green-dark);border:1px solid var(--border)}
  .type-picker button.on{background:var(--green-dark);color:var(--white);border-color:var(--green-dark)}
  .cat-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cat-picker button{padding:8px;border-radius:16px;font-size:11px;font-weight:700;background:var(--white);color:var(--ink);border:1px solid var(--border)}
  .cat-picker button.on{background:var(--green-dark);color:var(--white);border-color:var(--green-dark)}
  .info-box{border-radius:16px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .info-box.green{background:var(--green-soft);color:var(--green-dark)}
  .info-box.red{background:var(--danger-soft);color:var(--danger)}
  .info-box.dark{background:var(--green-dark);color:var(--white);flex-direction:column;align-items:stretch;gap:4px}
  .info-box.dark .row{display:flex;justify-content:space-between;font-size:12px}
  .info-box.dark .row.gold{color:var(--gold)}
  /* RECEIPT */
  .receipt{background:var(--cream);border:1px dashed var(--border);border-radius:16px;padding:16px}
  .receipt-head{text-align:center;padding-bottom:8px;border-bottom:1px dashed var(--border);margin-bottom:8px}
  .receipt-logo{width:44px;height:44px;border-radius:16px;background:var(--green-dark);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto}
  .receipt-shop{font-size:14px;font-weight:800;margin-top:6px}
  .receipt-sub{font-size:10px;color:var(--muted)}
  .receipt-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .receipt-row span:first-child{color:var(--muted)}
  .receipt-row span:last-child{font-weight:700}
  .receipt-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:8px;border-top:1px dashed var(--border)}
  .receipt-total .lbl{font-size:14px;font-weight:800}
  .receipt-total .val{font-size:18px;font-weight:800;color:var(--green-dark)}
  /* TABS INSIDE MORE */
  .more-tabs{display:flex;gap:4px;background:var(--green-soft);border-radius:99px;padding:4px;margin-bottom:12px}
  .more-tabs button{flex:1;padding:6px;border-radius:99px;font-size:11px;font-weight:700;color:var(--green-dark);display:flex;align-items:center;justify-content:center;gap:4px}
  .more-tabs button.on{background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  /* KHATA EXPAND */
  .khata-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .khata-head{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .khata-head:active{background:var(--cream)}
  .khata-avatar{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .khata-body{padding:0 14px 14px;border-top:1px dashed var(--border)}
  .info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
  .info-mini{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:6px 8px;text-align:center}
  .info-mini p:first-child{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
  .info-mini p:last-child{font-size:12px;font-weight:800;margin:2px 0 0}
  .pay-history{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:12px}
  .pay-history-title{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  .pay-history-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
  .khata-actions{display:flex;gap:8px;margin-top:12px}
  .khata-actions button{flex:1;padding:8px;border-radius:99px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
  .add-pay{display:flex;gap:8px;margin-top:10px}
  .add-pay input{flex:1;padding:10px 14px;border-radius:99px;border:1px solid var(--border);font-size:14px}
  .add-pay button{padding:0 18px;border-radius:99px;background:var(--green-dark);color:var(--white);font-size:12px;font-weight:800}
  /* CATEGORY BREAKDOWN */
  .cat-row{margin-bottom:8px}
  .cat-row-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
  .bar{height:6px;background:var(--green-soft);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;background:var(--green-accent);transition:width .5s}
  /* LOW STOCK ALERT */
  .alert-box{background:#FEF7E4;border:1px solid rgba(212,165,72,.33);border-radius:16px;padding:14px}
  .alert-box h3{font-size:14px;font-weight:800;color:#8B6114;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .alert-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .alert-row strong{color:#8B6114}
  /* BOTTOM NAV */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;padding:0 12px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:none}
  .nav-inner{pointer-events:auto;background:rgba(15,61,46,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px}
  .nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:16px;transition:transform .2s;color:rgba(255,255,255,.65);font-size:10px;font-weight:600}
  .nav-btn:active{transform:scale(.95)}
  .nav-btn.active{color:var(--gold)}
  .nav-btn.active::before{content:"";position:absolute;inset:0;border-radius:16px;background:rgba(212,165,72,.15);border:1px solid rgba(212,165,72,.33)}
  .nav-btn > *{position:relative;z-index:1}
  .nav-btn .ico{font-size:19px;margin-bottom:2px}
  /* TOAST */
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;background:var(--green-dark);color:var(--white);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .22s ease-out}
  .toast.error{background:var(--danger)}
  /* SALE CARD */
  .sale-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
  .sale-body{flex:1;min-width:0}
  .sale-right{text-align:right}
  .sale-right p:first-child{font-size:14px;font-weight:800;margin:0}
  .sale-right p:last-child{font-size:11px;color:var(--green-accent);font-weight:700;margin:2px 0 0}
  /* DAMAGE CARD */
  .dmg-img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0}
  .dmg-placeholder{width:56px;height:56px;border-radius:12px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  /* BACKUP CARD */
  .backup-card{background:var(--green-dark);border-radius:16px;padding:14px;color:var(--white);margin-bottom:12px}
  .backup-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .backup-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px 10px}
  .backup-stat p:first-child{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.7;margin:0}
  .backup-stat p:last-child{font-size:15px;font-weight:800;margin:2px 0 0}
  .backup-stat.gold p:last-child{color:var(--gold);font-size:13px}
  /* ANIMATIONS */
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes slideUpModal{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
  @keyframes countUp{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .fade-in{animation:fadeIn .26s ease-out}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="brand">
        <div class="brand-logo">👕</div>
        <div>
          <h1>NS Kapra</h1>
          <p>این ایس کپڑا · Shop Manager</p>
        </div>
      </div>
      <button class="refresh-btn" onclick="location.reload()" title="Refresh">⟳</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content" id="content"></div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-inner" id="nav"></div>
  </div>
</div>

<!-- MODAL ROOT -->
<div id="modal-root"></div>
<!-- TOAST ROOT -->
<div id="toast-root"></div>

<script>
/* =========================================================
 * NS Kapra — Standalone HTML App
 * All data stored in localStorage — works fully offline
 * ========================================================= */

// ----- STORAGE -----
const LS_KEY = 'ns_kapra_data_v1';
const DEFAULT_DATA = {
  stock: [],
  sales: [],
  khata: [],
  kpays: [],
  damage: [],
  expenses: []
};
let DB = loadDB();
function loadDB(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_DATA, ...parsed };
  } catch { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function nextId(arr){ return (arr.reduce((m,r)=>Math.max(m, Number(r.id)||0), 0)) + 1; }

// ----- HELPERS -----
const $ = (sel)=>document.querySelector(sel);
const num = v => { const n = Number(v); return isNaN(n)?0:n; };
const safe = v => String(v??'').trim();
const fmtPKR = n => 'Rs ' + Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0});
const todayISO = ()=> new Date().toISOString();
const isToday = iso => {
  if(!iso) return false;
  const d = new Date(iso), t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
};
const fmtDate = iso => { if(!iso)return'—'; try{return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch{return'—'} };
const fmtDateTime = iso => { if(!iso)return'—'; try{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true})}catch{return'—'} };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ----- CATEGORIES -----

// ----- TOAST -----
function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='error'?' error':'');
  el.innerHTML = (kind==='error'?'⚠ ':'✓ ') + esc(msg);
  $('#toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

// ----- STATS CALC -----
function calcStats(){
  const s = DB;
  const todaySales = s.sales.filter(x=>isToday(x.created_at)).reduce((a,x)=>a+num(x.total),0);
  const todayProfit = s.sales.filter(x=>isToday(x.created_at)).reduce((a,x)=>a+num(x.profit),0);
  const grossProfit = s.sales.reduce((a,x)=>a+num(x.profit),0);
  const totalExpense = s.expenses.reduce((a,x)=>a+num(x.amount),0);
  const totalLoss = s.damage.reduce((a,x)=>a+num(x.loss),0);
  const netProfit = grossProfit - totalExpense - totalLoss;
  const totalStockItems = s.stock.length;
  const totalUdharBalance = s.khata.reduce((a,x)=>a+num(x.balance),0);
  return { todaySales, todayProfit, grossProfit, totalExpense, totalLoss, netProfit, totalStockItems, totalUdharBalance };
}

function render(){
  const content = $('#content');
  content.innerHTML = '';
  content.className = 'content fade-in';
  // Force reflow to replay animation
  void content.offsetWidth;
  content.classList.add('fade-in');

  if(tab==='dashboard') renderDashboard(content);
  else if(tab==='stock') renderStock(content);
  else if(tab==='sales') renderSales(content);
  else if(tab==='khata') renderKhata(content);
  else if(tab==='damage') renderDamage(content);
  else if(tab==='expense') renderExpense(content);
  else if(tab==='backup') renderBackup(content);

  renderNav();
}

function renderNav(){
  const items = [
    { id:'dashboard', label:'Home',  ico:'🏠' },
    { id:'stock',     label:'Stock', ico:'📦' },
    { id:'sales',     label:'Sales', ico:'🛒' },
    { id:'khata',     label:'Khata', ico:'📖' },
    { id:'expense',   label:'More',  ico:'💼' }
  ];
  const activeGroup = ['expense','damage','backup'];
  $('#nav').innerHTML = items.map(it=>{
    const active = tab===it.id || (it.id==='expense' && activeGroup.includes(tab));
    return `<button class="nav-btn ${active?'active':''}" onclick="setTab('${it.id}')">
      <span class="ico">${it.ico}</span><span>${it.label}</span>
    </button>`;
  }).join('');
}
function setTab(t){ tab = t; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function pickType(btn, t){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('f-type').value = t;
}
function saveStock(id){
  const name = safe($('#f-name').value);
  if(!name){ toast('Enter fabric name','error'); return; }
  const type = $('#f-type').value;
  const quantity = num($('#f-qty').value);
  const cost_price = num($('#f-cost').value);
  const selling_price = num($('#f-sell').value);
  if(id){
    if(quantity<=0){
      DB.stock = DB.stock.filter(x=>x.id!==id);
      toast('Stock deleted (0 quantity)');
    } else {
      const item = DB.stock.find(x=>x.id===id);
      Object.assign(item, { name, type, quantity, cost_price, selling_price });
      toast('Stock updated');
    }
  } else {
    DB.stock.unshift({ id:nextId(DB.stock), name, type, quantity, cost_price, selling_price, created_at:todayISO() });
    toast('Stock added');
  }
  saveDB(); closeModal(); render();
}
function deleteStock(id){
  if(!confirm('Delete this stock item?')) return;
  DB.stock = DB.stock.filter(x=>x.id!==id);
  saveDB(); toast('Stock deleted'); render();
}

function updateSalePreview(){
  const sid = num($('#f-stock').value);
  const item = DB.stock.find(x=>x.id===sid);
  const avail = $('#sale-avail');
  const preview = $('#sale-preview');
  if(!item){ avail.innerHTML=''; preview.innerHTML=''; return; }
  avail.innerHTML = `<div class="info-box green"><span style="font-size:11px;font-weight:700">Available</span><span style="font-size:12px;font-weight:800">${item.quantity} ${item.type} · Sell ${fmtPKR(item.selling_price)}</span></div>`;
  const priceInput = $('#f-price');
  if(!priceInput.value) priceInput.placeholder = String(item.selling_price);
  const q = num($('#f-qty').value);
  const p = num(priceInput.value || item.selling_price);
  if(q>0){
    const total = q*p, profit = q*(p-num(item.cost_price));
    preview.innerHTML = `<div class="info-box dark">
      <div class="row"><span>Total</span><span>${fmtPKR(total)}</span></div>
      <div class="row gold"><span>Profit</span><span>+${fmtPKR(profit)}</span></div>
    </div>`;
  } else preview.innerHTML = '';
}
function doSale(){
  const sid = num($('#f-stock').value);
  const item = DB.stock.find(x=>x.id===sid);
  if(!item){ toast('Select stock','error'); return; }
  const q = num($('#f-qty').value);
  if(q<=0||q>num(item.quantity)){ toast('Invalid quantity','error'); return; }
  const price = num($('#f-price').value || item.selling_price);
  const total = q*price, profit = q*(price-num(item.cost_price));
  const row = {
    id: nextId(DB.sales), stock_id:item.id, stock_name:item.name, type:item.type,
    quantity:q, cost_price:num(item.cost_price), selling_price:price, total, profit,
    customer: safe($('#f-cust').value)||'Walk-in', mobile: safe($('#f-mob').value),
    created_at: todayISO()
  };
  DB.sales.unshift(row);
  const newQty = num(item.quantity)-q;
  if(newQty<=0) DB.stock = DB.stock.filter(x=>x.id!==item.id);
  else item.quantity = newQty;
  saveDB(); closeModal(); toast('Sale complete · Profit '+fmtPKR(profit));
  render();
  setTimeout(()=>openReceipt(row.id), 300);
}
function deleteSale(id){
  if(!confirm('Delete this sale?')) return;
  DB.sales = DB.sales.filter(x=>x.id!==id);
  saveDB(); toast('Sale deleted'); render();
}

function renderKhataCard(k){
  const bal = num(k.balance), settled = bal<=0;
  const history = DB.kpays.filter(p=>p.khata_id===k.id).sort((a,b)=>b.id-a.id);
  const open = khataOpen===k.id;
  return `

    ${open ? `
    <div class="khata-body">
      <div class="info-grid">
        <div class="info-mini"><p>Total</p><p>${fmtPKR(k.total_udhar)}</p></div>
        <div class="info-mini"><p>Paid</p><p style="color:#2E7D5B">${fmtPKR(k.paid)}</p></div>
        <div class="info-mini"><p>Balance</p><p style="color:${settled?'#2E7D5B':'#B4231F'}">${fmtPKR(bal)}</p></div>
      </div>
      ${k.note ? `<p style="font-size:11px;color:var(--muted);font-style:italic;margin-top:10px">"${esc(k.note)}"</p>`:''}
      ${history.length ? `
      <div class="pay-history">
        <p class="pay-history-title">Payment History</p>
        ${history.map(p=>`<div class="pay-history-row"><span>${fmtDate(p.created_at)}${p.note?' · '+esc(p.note):''}</span><strong style="color:#2E7D5B">+${fmtPKR(p.amount)}</strong></div>`).join('')}
      </div>`:''}
      ${!settled ? `
      <div class="add-pay">
        <input type="number" id="pay-${k.id}" placeholder="Amount received" />
        <button onclick="addKhataPayment(${k.id})">Pay</button>
      </div>`:''}
      <div class="khata-actions">
        <button class="btn-block wa" style="margin:0;padding:8px;font-size:11px" onclick='shareKhataWA(${JSON.stringify(k).replace(/'/g,"&#39;")})'>📲 WhatsApp</button>
        <button class="btn-block secondary" style="margin:0;padding:8px;font-size:11px" onclick="openKhataForm(${k.id})">✎ Edit</button>
        <button class="icon-btn danger" style="width:36px;height:36px" onclick="deleteKhata(${k.id})">🗑</button>
      </div>
    </div>`:''}

}
function openKhataForm(id){
  const editing = id ? DB.khata.find(x=>x.id===id) : null;
  const f = editing || { customer:'', mobile:'', total_udhar:'', paid:0, note:'' };
  openModal(editing?'Edit Khata · ترمیم':'New Khata · نیا کھاتہ', `
    <div class="field"><label>Customer · گاہک</label><input id="k-cust" value="${esc(f.customer)}" placeholder="Full name" /></div>
    <div class="field"><label>Mobile · موبائل</label><input id="k-mob" value="${esc(f.mobile)}" placeholder="03xx-xxxxxxx" /></div>
    <div class="row-2">
      <div class="field"><label>Total Udhar · کل ادھار</label><input id="k-total" type="number" value="${esc(f.total_udhar)}" oninput="updateKhataBal()" placeholder="0" /></div>
      <div class="field"><label>Paid · ادا شدہ</label><input id="k-paid" type="number" value="${esc(f.paid)}" oninput="updateKhataBal()" placeholder="0" /></div>
    </div>
    <div id="k-bal"></div>
    <div class="field"><label>Note · نوٹ (optional)</label><textarea id="k-note" rows="2" placeholder="e.g. Nikkah shopping">${esc(f.note)}</textarea></div>
    <button class="btn-block" onclick="saveKhata(${id||'null'})">${editing?'Update Khata':'Save Khata'}</button>
  `);
  updateKhataBal();
}
function updateKhataBal(){
  const t = num($('#k-total').value), p = num($('#k-paid').value), b = t-p;
  $('#k-bal').innerHTML = `<div class="info-box ${b>0?'red':'green'}"><span style="font-size:11px;font-weight:700">Balance · باقی</span><span style="font-size:13px;font-weight:800">${fmtPKR(b)}</span></div>`;
}
function saveKhata(id){
  const customer = safe($('#k-cust').value);
  if(!customer){ toast('Enter customer name','error'); return; }
  const mobile = safe($('#k-mob').value);
  const total_udhar = num($('#k-total').value);
  const paid = num($('#k-paid').value);
  const balance = total_udhar - paid;
  const note = safe($('#k-note').value);
  if(id){
    const k = DB.khata.find(x=>x.id===id);
    Object.assign(k, { customer, mobile, total_udhar, paid, balance, note, updated_at:todayISO() });
    toast('Khata updated');
  } else {
    DB.khata.unshift({ id:nextId(DB.khata), customer, mobile, total_udhar, paid, balance, note, created_at:todayISO(), updated_at:todayISO() });
    toast('Khata added');
  }
  saveDB(); closeModal(); render();
}
function addKhataPayment(id){
  const amt = num($('#pay-'+id).value);
  if(amt<=0){ toast('Enter amount','error'); return; }
  const k = DB.khata.find(x=>x.id===id);
  const newPaid = num(k.paid)+amt;
  const newBal = num(k.total_udhar)-newPaid;
  k.paid = newPaid; k.balance = newBal; k.updated_at = todayISO();
  DB.kpays.unshift({ id:nextId(DB.kpays), khata_id:k.id, customer:k.customer, kind:'payment', amount:amt, note:'', created_at:todayISO() });
  saveDB(); toast('Payment recorded'); render();
}
function deleteKhata(id){
  if(!confirm('Delete this khata?')) return;
  DB.khata = DB.khata.filter(x=>x.id!==id);
  DB.kpays = DB.kpays.filter(p=>p.khata_id!==id);
  saveDB(); toast('Khata deleted'); render();
}
function shareKhataWA(k){
  const txt = `*NS Kapra — Khata*\n─────────\nCustomer: ${k.customer}\nTotal: Rs ${k.total_udhar}\nPaid: Rs ${k.paid}\n*Balance: Rs ${k.balance}*\n─────────`;
  const phone = safe(k.mobile).replace(/[^0-9]/g,'');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
}

function openDamageForm(){
  if(DB.stock.length===0){ toast('Add stock first','error'); return; }
  const options = DB.stock.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.type}) · ${s.quantity}</option>`).join('');
  openModal('Add Damage · نقصان درج کریں', `
    <div class="field"><label>Select Stock · اسٹاک</label>
      <select id="d-stock"><option value="">— Choose —</option>${options}</select></div>
    <div class="row-2">
      <div class="field"><label>Qty · مقدار</label><input id="d-qty" type="number" placeholder="0" /></div>
      <div class="field"><label>Loss · نقصان (Rs)</label><input id="d-loss" type="number" placeholder="0" /></div>
    </div>
    <div class="field"><label>Reason · وجہ</label><textarea id="d-reason" rows="2" placeholder="e.g. Fabric torn while cutting"></textarea></div>
    <div class="field"><label>Photo · تصویر (optional)</label>
      <button type="button" class="btn-block secondary" style="margin:0" onclick="document.getElementById('d-img').click()">📷 Upload image</button>
      <input id="d-img" type="file" accept="image/*" style="display:none" onchange="previewDmgImage(this)" />
      <div id="d-preview"></div>
    </div>
    <button class="btn-block" onclick="saveDamage()">Save Damage</button>
  `);
}
let damageImageData = '';
function previewDmgImage(inp){
  const f = inp.files?.[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    damageImageData = e.target.result;
    $('#d-preview').innerHTML = `<img src="${damageImageData}" style="width:100%;height:112px;object-fit:cover;border-radius:12px;margin-top:8px" />`;
  };
  r.readAsDataURL(f);
}
function saveDamage(){
  const sid = num($('#d-stock').value);
  const item = DB.stock.find(x=>x.id===sid);
  if(!item){ toast('Select stock','error'); return; }
  const q = num($('#d-qty').value);
  if(q<=0||q>num(item.quantity)){ toast('Invalid quantity','error'); return; }
  const loss = num($('#d-loss').value) || q*num(item.cost_price);
  const reason = safe($('#d-reason').value);
  DB.damage.unshift({
    id: nextId(DB.damage), stock_id:item.id, stock_name:item.name, type:item.type,
    quantity:q, reason, loss, image_url:damageImageData, created_at:todayISO()
  });
  const newQty = num(item.quantity)-q;
  if(newQty<=0) DB.stock = DB.stock.filter(x=>x.id!==item.id);
  else item.quantity = newQty;
  damageImageData = '';
  saveDB(); closeModal(); toast('Damage recorded'); render();
}
function deleteDamage(id){
  if(!confirm('Delete damage record?')) return;
  DB.damage = DB.damage.filter(x=>x.id!==id);
  saveDB(); toast('Deleted'); render();
}

              <p class="list-title">${EXPENSE_LABELS[e.category]||e.category}</p>

function pickCat(btn, c){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));

function saveExpense(){
  const amount = num($('#e-amt').value);

function deleteExpense(id){

  root.innerHTML = `

      <div class="section-title">
        <div class="section-icon" style="background:#2E7D5B18;color:#2E7D5B">💾</div>

      </div>
    </div>

    <div class="backup-card">
      <p class="backup-title">💾 Data Summary · ڈیٹا</p>
      <div class="backup-grid">
        <div class="backup-stat"><p>Stock items</p><p>${DB.stock.length}</p></div>
        <div class="backup-stat"><p>Sales</p><p>${DB.sales.length}</p></div>
        <div class="backup-stat"><p>Khata</p><p>${DB.khata.length}</p></div>
        <div class="backup-stat"><p>Damage</p><p>${DB.damage.length}</p></div>
        <div class="backup-stat"><p>Expenses</p><p>${DB.expenses.length}</p></div>
        <div class="backup-stat gold"><p>Net Profit</p><p>${fmtPKR(s.netProfit)}</p></div>
      </div>
    </div>

    <button class="btn-block" style="background:var(--green-accent)" onclick="exportBackup()">⬇ Export JSON Backup</button>
    <button class="btn-block secondary" onclick="document.getElementById('imp-file').click()">📁 Import Backup File</button>
    <input type="file" id="imp-file" accept="application/json" style="display:none" onchange="importBackup(this)" />

    <div style="padding-top:12px;margin-top:12px;border-top:1px dashed var(--border)">
      <button class="btn-block danger" onclick="resetAll()">🗑 Reset All Data</button>
      <p style="font-size:10px;text-align:center;color:var(--muted);margin-top:8px">یاد رہے: تمام ڈیٹا حذف ہو جائے گا</p>
    </div>
  `;
}
function exportBackup(){
  const payload = { app:'NS Kapra', exported_at:todayISO(), ...DB };
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ns-kapra-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Backup exported');
}
function importBackup(inp){
  const f = inp.files?.[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const j = JSON.parse(e.target.result);
      DB = {
        stock: j.stock || [],
        sales: j.sales || [],
        khata: j.khata || [],
        kpays: j.kpays || j.khataPayments || [],
        damage: j.damage || [],
        expenses: j.expenses || []
      };
      saveDB(); toast('Import complete'); render();
    } catch { toast('Invalid backup','error'); }
  };
  r.readAsText(f);
  inp.value = '';
}
function resetAll(){
  if(!confirm('Reset ALL data? This cannot be undone.')) return;
  if(!confirm('Are you REALLY sure? Everything will be wiped.')) return;
  DB = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveDB(); toast('All data reset'); render();
}

function moreTabsHtml(active){
  const items = [
    { id:'expense', label:'Expense', ico:'💼' },
    { id:'damage',  label:'Damage',  ico:'⚠' },
    { id:'backup',  label:'Backup',  ico:'💾' }
  ];
  return `<div class="more-tabs">${items.map(it=>`<button class="${active===it.id?'on':''}" onclick="setTab('${it.id}')"><span>${it.ico}</span> ${it.label}</button>`).join('')}</div>`;
}
